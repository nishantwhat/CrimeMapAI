[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crimemapai"
version = "0.1.0"
description = "ML-based crime risk prediction and spatio-temporal analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crimemapai-profile = "crimemapai.data.cli:main"
